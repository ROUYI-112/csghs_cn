<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>國文段考闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one card at a time on a peach-to-teal dusk gradient (palette borrowed from a painted portrait); cards are soft paper */
:root{
  --sky:#EBC9B8; --mist:#C9C9B9; --sea:#3F8C88; --deep:#1C5A5E;
  --paper:#FBF6EE; --paper2:#F2EADC; --ink:#2B3A3A; --muted:#6E7A72; --line:#E4D8C6;
  --accent:#1F6A6A; --accent-ink:#FBF6EE;
  --persimmon:#E98A4E; --blossom:#E7A1A6; --oriole:#C9C24A;
  --hl:#F7C9A0; --good:#3E7D4E; --good-bg:#E4EFD9; --bad:#C2564A; --bad-bg:#F8E1DB;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--deep);min-height:100%}
body{min-height:100vh;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;padding:28px 16px 56px;
  background:linear-gradient(180deg,var(--sky) 0%,var(--mist) 22%,var(--sea) 62%,var(--deep) 100%) fixed}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
mark{background:linear-gradient(transparent 50%,var(--hl) 50%);color:inherit;padding:0 2px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--persimmon);outline-offset:2px}

/* home */
.hero{display:flex;flex-direction:column;gap:8px;color:var(--deep)}
.hero h1{font-size:2.4rem;letter-spacing:.04em}
.hero p{margin:0;font-size:1rem;color:#4A5B57}
.seeds{display:flex;gap:6px}
.seeds i{width:12px;height:12px;border-radius:50%;display:block}
.scope{display:flex;flex-wrap:wrap;gap:8px}
.scope-wrap{display:flex;flex-direction:column;gap:8px}
.scope-wrap small{font-size:.85rem;color:var(--deep)}
.scope button{font-size:.92rem;padding:6px 14px;border-radius:999px;border:2px solid transparent;background:rgba(251,246,238,.85);color:var(--deep);font-weight:500;transition:border-color .15s,transform .15s}
.scope button:hover{border-color:var(--persimmon);transform:translateY(-2px)}
.scope button em{font-style:normal;color:var(--persimmon);margin-left:4px}
.scope span{font-size:.85rem;padding:3px 12px;border-radius:999px;background:rgba(251,246,238,.6);color:var(--deep)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.lv{background:var(--paper);border:none;border-radius:20px;padding:16px 16px 16px 18px;text-align:left;display:flex;flex-direction:column;gap:4px;
  box-shadow:0 6px 18px rgba(28,90,94,.18);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.lv::before{content:"";position:absolute;right:-18px;top:-18px;width:56px;height:56px;border-radius:50%;background:var(--c);opacity:.35}
.lv:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(28,90,94,.26)}
.lv .n{font-size:.8rem;color:var(--muted);letter-spacing:.05em}
.lv .t{font-family:var(--display);font-weight:700;font-size:1.35rem;color:var(--deep)}
.lv .d{font-size:.88rem;color:var(--muted);line-height:1.5}
.lv .done{color:var(--good);font-size:.85rem;font-weight:700}
.tip{background:rgba(251,246,238,.82);border-radius:20px;padding:16px 18px;font-size:.95rem;color:var(--ink)}
.tip b{font-family:var(--display);font-size:1.1rem;color:var(--deep)}

/* quiz */
.top{display:flex;align-items:center;gap:12px}
.back{background:rgba(251,246,238,.7);border:none;border-radius:999px;font-size:.95rem;color:var(--deep);padding:4px 14px}
.bar{flex:1;height:10px;background:rgba(251,246,238,.55);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--oriole),var(--persimmon));border-radius:999px;transition:width .35s}
.count{font-size:.95rem;color:var(--deep);font-weight:700;font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}
.card{background:var(--paper);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(28,90,94,.25)}
.src{align-self:flex-start;font-size:.8rem;padding:2px 12px;border-radius:999px;background:var(--paper2);color:var(--accent)}
.again{align-self:flex-start;font-size:.8rem;padding:2px 12px;border-radius:999px;background:var(--bad-bg);color:var(--bad)}
.q{font-size:1.25rem;font-weight:500;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--paper2);border:2px solid transparent;border-radius:16px;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt .k{font-family:var(--display);font-weight:700;color:var(--persimmon);flex:none;width:1.2em}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.45}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb .v{font-family:var(--display);font-weight:700;font-size:1.3rem}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.fb p{margin:0}
.trap{align-self:flex-start;font-size:.85rem;padding:2px 12px;border-radius:999px;background:var(--persimmon);color:var(--paper);font-weight:700}
.next{background:var(--accent);color:var(--accent-ink);border:none;border-radius:16px;padding:14px;font-size:1.15rem;font-family:var(--display);font-weight:700}
.reveal{background:var(--paper2);border:2px dashed var(--sea);border-radius:16px;padding:14px;font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--accent)}
.ans{background:var(--good-bg);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ans .lbl{font-size:.8rem;letter-spacing:.06em;color:var(--good);font-weight:700}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys span{font-size:.88rem;background:var(--paper);border-radius:999px;padding:2px 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghost{background:var(--paper2);border:none;border-radius:16px;padding:14px;font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--deep)}
.end{text-align:center;align-items:center}
.end .big{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1.1;color:var(--persimmon)}
.end h2{color:var(--deep)}
.end .stat{font-size:1.05rem;color:var(--muted)}
.end .btns{display:flex;flex-direction:column;gap:10px;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hero-art{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.hero-art img{width:150px;max-width:100%;aspect-ratio:580/755;object-fit:cover;border-radius:20px;box-shadow:0 10px 26px rgba(28,90,94,.3);display:block}
@media (max-width:440px){.hero-art img{width:118px}.hero h1{font-size:1.85rem;white-space:nowrap}}
.end img{width:160px;max-width:100%;border-radius:20px;box-shadow:0 10px 26px rgba(28,90,94,.25)}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const LEVELS = [
{ id:"zi", name:"錯字雷區", desc:"錯別字、字音，一字之差就扣分", qs:[
 {s:"飛魚季",q:"哪一個用字<b>完全正確</b>？",o:["疲備不堪","一椿心事","遵尋規則","裝傻發楞"],a:3,w:"正確寫法：疲**憊**、一**樁**、遵**循**。「憊」是累，「備」是準備。"},
 {s:"出師表",q:"「親自耕田」的那個字是？　＿耕南陽",o:["恭","躬","弓","供"],a:1,w:"**躬**＝親身、親自。"},
 {s:"出師表",q:"自己惹的禍：＿由自取",o:["疚","咎","究","救"],a:1,w:"**咎**＝過錯。「疚」是心裡不安（內疚）。"},
 {s:"出師表",q:"偏袒＿私",o:["循","徇","殉","洵"],a:1,w:"**徇**＝順從、偏向。「循」是遵守（遵循）。"},
 {s:"勞山道士",q:"背著書箱出外求學：負＿",o:["籍","笈","急","級"],a:1,w:"**笈**＝書箱，所以是竹字頭。"},
 {s:"勞山道士",q:"才華＿溢",o:["揚","洋","漾","陽"],a:1,w:"像水滿出來，所以是三點水的**洋**。"},
 {s:"出師表",q:"哪一組讀音<b>完全相同</b>？",o:["菲薄／心扉","殊榮／雙姝","詔書／昭告","崩殂／刀俎"],a:1,w:"殊、姝都念ㄕㄨ。詔ㄓㄠˋ、昭ㄓㄠ **聲調不同**也算不同。",t:"完全相同＝連聲調也要一樣"}
]},
{ id:"yi", name:"文言小字", desc:"一字多義、通同字、虛字語氣", qs:[
 {s:"出師表",q:"「<mark>庶</mark>竭駑鈍」的「庶」是？",o:["希望","大概","眾多","感嘆"],a:0,w:"**庶＝希望**（期望語氣）。殆、其＝大概（推測語氣）。"},
 {s:"勞山道士",q:"「未果，<mark>尋</mark>病終」的「尋」是？",o:["尋找","不久","經常","平常"],a:1,w:"**尋＝不久**。同一家的還有：俄頃、移時、已而、既而。"},
 {s:"勞山道士",q:"「<mark>數</mark>為余言」的「數」是？",o:["計算","屢次","幾個","不久"],a:1,w:"數（ㄕㄨㄛˋ）＝**屢次**，是頻率，不是時間。"},
 {s:"勞山道士",q:"「不<mark>勝</mark>酒力」的「勝」是？",o:["勝利","美好","承受得住","超過"],a:2,w:"不勝＝**承受不了**。「良宵勝樂」的勝才是美好，兩個不一樣。"},
 {s:"勞山道士",q:"「日<mark>薄</mark>西山」的「薄」是？",o:["輕薄","迫近","微小","看輕"],a:1,w:"**薄＝迫近**，太陽快要碰到西山。「薄暮」也是這個意思。"},
 {s:"出師表",q:"「三<mark>顧</mark>臣於草廬之中」的「顧」是？",o:["回頭看","拜訪","照顧","顧慮"],a:1,w:"三顧＝**拜訪**三次。「顧視」才是看。"},
 {s:"出師表",q:"「臣敢竭＿＿之力」，比喻輔佐君王的人",o:["肘腋","股肱","臟腑","髀肉"],a:1,w:"**股肱**＝大腿和手臂，君王的左右手。"},
 {s:"出師表",q:"哪一個是<b>偏義複詞</b>（只取一個字的意思）？",o:["崩殂","損益","異同","優劣"],a:2,w:"**異同**只取「異」。崩殂兩字同義；損益、優劣兩個字都有意思。"},
 {s:"勞山道士",q:"通同字：鬚眉畢「見」，「見」通？",o:["看","現","建","間"],a:1,w:"見通**現**，顯現。"},
 {s:"勞山道士",q:"通同字：「俛」首驟入，「俛」通？",o:["免","俯","勉","晚"],a:1,w:"俛通**俯**，低頭。"},
 {s:"勞山道士",q:"通同字：竊「忻」慕，「忻」通？",o:["新","欣","心","興"],a:1,w:"忻通**欣**，欣喜。"}
]},
{ id:"cy", name:"成語・歇後語", desc:"海的成語、魚的俗語、孔明歇後語", qs:[
 {s:"飛魚季",q:"形容「虛幻不實」的是？",o:["東海揚塵","海市蜃樓","河清海晏","海屋添籌"],a:1,w:"**海市蜃樓**＝虛幻。"},
 {s:"飛魚季",q:"「東海揚塵」的意思是？",o:["不自量力","世事變化極大","水很清澈","祝人長壽"],a:1,w:"東海變成陸地揚起塵土＝**世事變化極大**。",t:"別看字面猜意思"},
 {s:"飛魚季",q:"「河清海晏」的意思是？",o:["水清見底","天下太平","海浪平靜","河水氾濫"],a:1,w:"**天下太平**。不是在說水很清。",t:"別看字面猜意思"},
 {s:"飛魚季",q:"「一去不復返」的成語是？",o:["泥牛入海","海屋添籌","海市蜃樓","東海揚塵"],a:0,w:"泥做的牛掉進海裡就融化了＝**一去不回**。"},
 {s:"勞山道士",q:"「吮癰舐痔」比喻什麼？",o:["孝順父母","諂媚巴結","醫術高明","刻苦耐勞"],a:1,w:"**諂媚巴結**的無恥行為，不能拿來稱讚孝子。"},
 {s:"勞山道士",q:"「擲地有聲」形容什麼？",o:["說話很大聲","文辭優美、音韻鏗鏘","東西很重","態度堅決"],a:1,w:"用來稱讚**文章寫得好**。"},
 {s:"飛魚季",q:"沒恆心，成不了氣候：",o:["放長線釣大魚","三天打魚，兩天曬網","魚幫水，水幫魚","大魚吃小魚"],a:1,w:"**三天打魚，兩天曬網**。"},
 {s:"飛魚季",q:"一個主內一個主外，互相幫忙：",o:["魚幫水，水幫魚","手插魚籃，避不得腥","放長線釣大魚","大魚吃小魚"],a:0,w:"**魚幫水，水幫魚**＝相輔相成。"},
 {s:"出師表",q:"劉備見孔明——",o:["懷才不遇","如魚得水","五體投地","計上心頭"],a:1,w:"劉備說「吾得孔明，**如魚得水**」。"},
 {s:"出師表",q:"諸葛亮做丞相——",o:["鞠躬盡瘁","智勇雙全","執法如山","滿載而歸"],a:0,w:"**鞠躬盡瘁**，死而後已。"},
 {s:"出師表",q:"孔明借箭——",o:["糊里糊塗","滿載而歸","化險為夷","懷才不遇"],a:1,w:"草船借箭，箭插滿船＝**滿載而歸**。"},
 {s:"出師表",q:"諸葛亮住茅廬——",o:["計上心頭","懷才不遇","鞠躬盡瘁","如魚得水"],a:1,w:"還沒被請出山，有才卻沒地方用＝**懷才不遇**。"},
 {s:"出師表",q:"「先帝三顧臣於草廬……由是感激，遂許先帝以驅馳」最接近？",o:["龍無雲而不行","士為知己者死","良禽擇木而棲","有志者事竟成"],a:1,w:"被賞識 → 願意效命＝**士為知己者死**。「良禽擇木」是自己主動挑老闆，不對。"}
]},
{ id:"kw", name:"課文重點", desc:"三課最常考的理解題", qs:[
 {s:"飛魚季",q:"祈禱詞「使<mark>我們</mark>永遠結合在一起」，「我們」是？",o:["只有飛魚","飛魚和達悟族人","只有族人","飛魚神"],a:1,w:"**魚＋人**一起，所以是「族人與自然同生共存」。",t:"選項只對一半＝錯"},
 {s:"飛魚季",q:"作者說的「被漢化」，重點是？",o:["只知道讀書","不會捕魚，部落文化斷掉","改用漢人名字","搬去臺北住"],a:1,w:"作者去捕魚就是為了洗掉漢化的惡名 → 核心是**部落文化斷裂**。"},
 {s:"飛魚季",q:"作者被鄰居當成「次等男人」，因為？",o:["手無縛雞之力","不會潛水射魚，沒繼承傳統技能","只會讀書","家裡沒有船"],a:1,w:"作者自己說「**肺活量很好**」，所以「手無縛雞之力」跟原文矛盾。",t:"選項和原文矛盾"},
 {s:"飛魚季",q:"「深藍的鰭背、淺黃的腹部」寫的是？",o:["飛魚","鬼頭刀","鯨豚","鯊魚"],a:1,w:"是**鬼頭刀**，不是飛魚。讀的時候要分清楚在寫誰。"},
 {s:"飛魚季",q:"「機關槍掃射的中彈聲」是？",o:["真的有人開槍","譬喻飛魚撞船的聲音","漁船的引擎聲","颱風的聲音"],a:1,w:"這是**譬喻**。",t:"別把譬喻當事實"},
 {s:"出師表",q:"「<mark>誠宜</mark>開張聖聽」是父子語（叮嚀後主），關鍵字是？",o:["宜","臣","先帝","陛下"],a:0,w:"看到**宜／不宜／不可**＝像爸爸在叮嚀。"},
 {s:"出師表",q:"劉備臨終託孤，對應〈出師表〉哪一句？",o:["臨崩寄臣以大事","三顧臣於草廬之中","追先帝之殊遇","庶竭駑鈍"],a:0,w:"臨崩＝**快要死的時候**，寄臣以大事＝託付。"},
 {s:"出師表",q:"諸葛亮的一生，哪個順序對？",o:["隆中對 → 三顧茅廬 → 六出祁山 → 七擒孟獲","三顧茅廬 → 隆中對 → 七擒孟獲 → 六出祁山","三顧茅廬 → 七擒孟獲 → 隆中對 → 六出祁山","七擒孟獲 → 三顧茅廬 → 隆中對 → 六出祁山"],a:1,w:"劉備先來拜訪，才有隆中對；**先平定南方（七擒），再北伐（六出祁山）**。"},
 {s:"出師表",q:"「映階碧草<mark>自</mark>春色，隔葉黃鸝<mark>空</mark>好音」哪二字透露落寞？",o:["自、空","碧、黃","春、好","映、隔"],a:0,w:"自＝獨自、空＝白白地：再美也沒人欣賞。",t:"問「字」就寫字，別抄整句"},
 {s:"勞山道士",q:"道士說「歸宜潔持，否則不驗」，意思是？",o:["回家要洗乾淨","保持心念純潔，不虛榮、不拿法術謀利","每天都要練習","不能告訴家人"],a:1,w:"潔持＝**心念純潔**。"},

const $ = s=>document.querySelector(s);
const app = $("#app");
const md = s => s.replace(/\*\*(.+?)\*\*/g,"<mark>$1</mark>");
let done = {};
try{ done = JSON.parse(localStorage.getItem("gw-done")||"{}") }catch(e){}
function save(){ try{ localStorage.setItem("gw-done",JSON.stringify(done)) }catch(e){} }
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };

function home(){
  app.innerHTML = `
  <div class="hero-art"><div class="hero">
    <div class="seeds"><i style="background:var(--persimmon)"></i><i style="background:var(--blossom)"></i><i style="background:var(--oriole)"></i></div>
    <h1>國文段考闖關</h1>
    <p>一次一題，答錯的等一下會再出現，答對才算過關。</p>
  </div><img src="${ART}" alt="插畫"></div>
  <div class="scope-wrap"><small>只想練某一課？點課名：</small><div class="scope">${LESSONS.map(([no,nm])=>`<button class="ls" data-s="${nm}">第${no}課 ${nm}<em>${countLesson(nm)} 題 →</em></button>`).join("")}</div></div>
  <div class="levels">${LEVELS.map((l,i)=>`
    <button class="lv" data-i="${i}" style="--c:${["var(--persimmon)","var(--blossom)","var(--oriole)","var(--sea)","var(--persimmon)","var(--blossom)","var(--oriole)"][i]}">
      <span class="n">第 ${i+1} 關 · ${l.qs.length} 題</span>
      <span class="t">${l.name}</span>
      <span class="d">${l.desc}</span>
      ${done[l.id]?`<span class="done">✓ 已過關</span>`:""}
    </button>`).join("")}
  </div>
  <div class="tip"><b>建議玩法</b><br>一次只玩一關，大約 5 分鐘。玩完休息一下，再挑下一關。</div>`;
  app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>start(+b.dataset.i));
  app.querySelectorAll(".ls").forEach(b=>b.onclick=()=>startLesson(b.dataset.s));
  window.scrollTo(0,0);
}

const LESSONS=[["一","飛魚季"],["二","出師表"],["四","勞山道士"]];
const lessonQs=nm=>LEVELS.flatMap(l=>l.qs.filter(q=>q.s===nm).map(q=>l.flash?{...q,f:true}:q));
const countLesson=nm=>lessonQs(nm).length;
function startLesson(nm){
  const no=LESSONS.find(x=>x[1]===nm)[0];
  run({id:"lesson-"+nm,name:`第${no}課 ${nm} 總複習`,qs:lessonQs(nm)},-1,()=>startLesson(nm));
}
let S;
function start(i){ run(LEVELS[i],i,()=>start(i)); }
function run(L,i,again){
  S = {i, L, again, queue: shuffle(L.qs.map((q,n)=>({...q,_id:n}))), total:L.qs.length, cleared:0, firstTry:0, missed:new Set()};
  show();
}
function header(){
  const pct = Math.round(S.cleared/S.total*100);
  return `<div class="top"><button class="back" id="back">← 關卡</button>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <span class="count">${S.cleared}/${S.total}</span></div>`;
}
function show(){
  if(!S.queue.length) return finish();
  const q = S.queue[0];
  const retry = S.missed.has(q._id);
  if(S.L.flash || q.f){
    app.innerHTML = header()+`<div class="card">
      <span class="src">${q.s}</span>${retry?'<span class="again">再看一次</span>':""}
      <div class="q">${q.q}</div>
      <button class="reveal" id="rv">想好了，看答案</button>
      <div id="out"></div></div>`;
    $("#rv").onclick=()=>{
      $("#rv").hidden=true;
      $("#out").innerHTML = `<div class="ans"><span class="lbl">參考答案</span><div>${md(q.a)}</div>
        <span class="lbl">得分關鍵</span><div class="keys">${q.k.map(x=>`<span>${x}</span>`).join("")}</div></div>
        <div class="row2" style="margin-top:12px"><button class="ghost" id="no">再看一次</button><button class="next" id="yes">我會了</button></div>`;
      $("#yes").onclick=()=>{ if(!retry) S.firstTry++; S.cleared++; S.queue.shift(); show() };
      $("#no").onclick=()=>{ S.missed.add(q._id); S.queue.push(S.queue.shift()); show() };
    };
  } else {
    const order = shuffle(q.o.map((t,j)=>j));
    app.innerHTML = header()+`<div class="card">
      <span class="src">${q.s}</span>${retry?'<span class="again">剛剛錯過的題目</span>':""}
      <div class="q">${q.q}</div>
      <div class="opts">${order.map((j,n)=>`<button class="opt" data-j="${j}"><span class="k">${"ABCD"[n]}</span><span>${q.o[j]}</span></button>`).join("")}</div>
      <div id="out"></div></div>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(q,+b.dataset.j,retry));
  }
  $("#back").onclick=home;
  window.scrollTo(0,0);
}
function pick(q,j,retry){
  const ok = j===q.a;
  app.querySelectorAll(".opt").forEach(b=>{
    const v=+b.dataset.j; b.disabled=true;
    if(v===q.a) b.classList.add("right");
    else if(v===j) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  $("#out").innerHTML = `<div class="fb ${ok?"ok":"no"}">
    <span class="v">${ok?pickOne(["答對了！","正確！","漂亮！","沒錯！"]):"差一點！"}</span>
    <p>${md(q.w)}</p>
    ${q.t?`<span class="trap">陷阱：${q.t}</span>`:""}
    ${ok?"":"<p style='font-size:.9rem;opacity:.8'>這題等一下會再出現。</p>"}
  </div><button class="next" id="nx" style="width:100%;margin-top:12px">下一題</button>`;
  $("#nx").onclick=()=>{
    const cur=S.queue.shift();
    if(ok){ S.cleared++; if(!retry) S.firstTry++; }
    else { S.missed.add(cur._id); S.queue.push(cur); }
    show();
  };
  $("#nx").focus({preventScroll:true});
  $("#out").scrollIntoView({behavior:"smooth",block:"nearest"});
}
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function finish(){
  done[S.L.id]=true; save();
  const nextI = S.i>=0 && S.i+1 < LEVELS.length ? S.i+1 : null;
  app.innerHTML = `<div class="card end">
    <img src="${ART}" alt="插畫"><div class="big">過關！</div>
    <h2>${S.L.name}</h2>
    <div class="stat">一次就答對 ${S.firstTry} / ${S.total} 題${S.missed.size?`，有 ${S.missed.size} 題是練了第二次才會的`:"，全部一次過！"}</div>
    <div class="btns">
      ${nextI!==null?`<button class="next" id="nl">下一關：${LEVELS[nextI].name}</button>`:""}
      <button class="ghost" id="re">這關再玩一次</button>
      <button class="ghost" id="hm">回到關卡</button>
    </div></div>`;
  if(nextI!==null) $("#nl").onclick=()=>start(nextI);
  $("#re").onclick=S.again;
  $("#hm").onclick=home;
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
  if(!S || !document.querySelector(".opt")) return;
  const n="1234".indexOf(e.key); const opts=document.querySelectorAll(".opt:not(:disabled)");
  if(n>=0 && opts[n]) opts[n].click();
});
home();
</script>
</body>
</html>
